[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greentrace"
version = "0.1.0"
description = "GreenTrace 联盟链仿真平台：面向绿色供应链的 PBFT 风格区块链"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=41",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "coverage>=7.16.2"]
quality = ["ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["assignment", "arg-type", "index", "var-annotated"]

[project.scripts]
greentrace-demo = "greentrace.demo:main"
greentrace-api = "greentrace.api:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
